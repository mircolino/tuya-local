name: DHW Heat Pump
products:
  - id: tngxiuemnvg16rzl
    manufacturer: Mitsubishi Heavy Industries
    model: TWMBS 2x03 J-1
    model_id: 000004d65i
entities:
  - entity: water_heater
    dps:
      - id: 1
        type: boolean
        name: operation_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: work_mode
            conditions:
              - dps_val: auto
                value: "Auto"
              - dps_val: eco
                value: eco
              - dps_val: mix
                value: performance
              - dps_val: electric
                value: electric
              - dps_val: air
                value: "Fan"
      - id: 2
        type: integer
        name: temperature
        unit: C
        range:
          min: 35
          max: 70
      - id: 3
        type: integer
        name: current_temperature
        range:
          min: -20
          max: 100
      - id: 4
        type: string
        name: work_mode
        hidden: true
  - entity: binary_sensor
    name: State
    icon: mdi:wrench-outline
    class: problem
    category: diagnostic
    dps:
      - id: 21
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 21
        type: bitfield
        name: fault_code
      - id: 21
        type: bitfield
        name: description
        mapping:
          - dps_val: 0
            value: ok
          - dps_val: 1
            value: P01 Lower water tank temperature sensor fault
          - dps_val: 2
            value: P02 Upper water tank temperature sensor fault
          - dps_val: 4
            value: P03 Coil temperature sensor fault
          - dps_val: 8
            value: P04 Return gas temperature sensor fault
          - dps_val: 16
            value: P05 Ambient temperature sensor fault
          - dps_val: 32
            value: P06 Winter antifreeze protection
          - dps_val: 64
            value: E01 High pressure protection
          - dps_val: 128
            value: E02 Low pressure protection
          - dps_val: 256
            value: E03 Overheat protection
          - dps_val: 512
            value: PA Compressor limit or water tank temperature protection
          - dps_val: 1024
            value: E08 Communication fault
          - dps_val: 2048
            value: E06 Anode Alarm
          - dps_val: 4096
            value: EA9 Microcontroller ROM fault
          - dps_val: 8192
            value: CS Defrosting / Refrigerant recovery
